name: Deploy Backend (ECR + EC2)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'Dockerfile.backend'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC con AWS
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false   # no cancelar un deploy a medio camino

env:
  AWS_REGION: us-east-1
  ECR_REPO: amsa-gestion-backend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (build cross-arch arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_BACKEND }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # La EC2 es arm64 (Graviton t4g) → la imagen DEBE ser linux/arm64.
      # El runner es x86, así que buildx + QEMU compilan arm64 por emulación.
      - name: Build & push image (linux/arm64)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO"
          docker buildx build --platform linux/arm64 \
            -f Dockerfile.backend \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            --push .
          echo "IMAGE_URI=$IMAGE:${{ github.sha }}" >> "$GITHUB_ENV"

      # Dispara el deploy en la EC2 vía SSM (sin SSH ni puerto 22 expuesto).
      # /opt/amsa-gestion/deploy.sh lo coloca el user-data de Terraform.
      - name: Deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          DEPLOY_CMD="cd /opt/amsa-gestion && aws ssm get-parameter --name /amsa-gestion/_deploy_sh --query Parameter.Value --output text --region ${AWS_REGION} | sudo tee deploy.sh >/dev/null && sudo chmod +x deploy.sh && sudo ./deploy.sh '$IMAGE_URI'"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend ${{ github.sha }}" \
            --parameters "{\"commands\":[\"$DEPLOY_CMD\"]}" \
            --timeout-seconds 900 \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"

          # Poll hasta estado terminal (~12 min): el 1er pull arm64 + db push + up es lento.
          FINAL=""
          for i in $(seq 1 72); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "[$i] SSM: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) FINAL="$STATUS"; break ;;
            esac
            sleep 10
          done

          echo "----- stdout -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -50
          echo "Status final: ${FINAL:-timeout}"

          if [ "$FINAL" != "Success" ]; then
            echo "----- stderr -----"
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text | tail -50
            exit 1
          fi
