name: Deploy Backend (ECR + EC2)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'Dockerfile.backend'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC con AWS
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false   # no cancelar un deploy a medio camino

env:
  AWS_REGION: us-east-1
  ECR_REPO: amsa-gestion-backend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_BACKEND }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO"
          docker build -f Dockerfile.backend \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "IMAGE_URI=$IMAGE:${{ github.sha }}" >> "$GITHUB_ENV"

      # Dispara el deploy en la EC2 vía SSM (sin SSH ni puerto 22 expuesto).
      # /opt/amsa-gestion/deploy.sh lo coloca el user-data de Terraform.
      - name: Deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          DEPLOY_CMD="cd /opt/amsa-gestion && aws ssm get-parameter --name /amsa-gestion/_deploy_sh --query Parameter.Value --output text --region ${AWS_REGION} | sudo tee deploy.sh >/dev/null && sudo chmod +x deploy.sh && sudo ./deploy.sh '$IMAGE_URI'"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend ${{ github.sha }}" \
            --parameters "{\"commands\":[\"$DEPLOY_CMD\"]}" \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          echo "----- stdout -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "Status final: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "----- stderr -----"
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi
